<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'">
<title>Obsi-boty</title>
<style>
  :root {
    --text:#ece6fb; --soft:#cfc4ea; --muted:#9d90bd; --accent:#c4b5fd; --violet:#8b5cf6; --err:#ff9db5;
    --gx:100%; --gy:100%;                 /* where the border glows brightest: the corner closest to Obsi-boty */
  }
  body.side-right { --gx:0%; }
  html, body { margin:0; background:transparent; overflow:hidden; font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif; }
  body { padding:8px 52px 10px 8px; }               /* the empty strip on Obsi-boty's side holds the energy arc */
  body.side-right { padding:8px 8px 10px 52px; }

  /* ---------- glass panel ---------- */
  .card { position:relative; color:var(--text); border-radius:24px; border:1.5px solid transparent; overflow:hidden; display:flex; flex-direction:column;
    background:
      linear-gradient(158deg, rgba(40,30,62,.94) 0%, rgba(22,16,36,.95) 55%, rgba(16,11,26,.96) 100%) padding-box,
      radial-gradient(circle at var(--gx) var(--gy), #e4d6ff 0%, #a47dff 18%, rgba(124,77,219,.75) 42%, rgba(124,77,219,.38) 75%) border-box;
    box-shadow: 0 18px 48px rgba(0,0,0,.55), 0 0 26px rgba(124,58,237,.28); }
  .card::before { content:''; position:absolute; inset:0; pointer-events:none; border-radius:inherit;   /* diagonal glass sheen */
    background:linear-gradient(118deg, rgba(255,255,255,.07) 0%, rgba(255,255,255,.025) 38%, transparent 38.2%); }
  .card::after { content:''; position:absolute; width:260px; height:260px; pointer-events:none;           /* light bouncing off the corner near Obsi */
    left:calc(var(--gx) - 130px); top:calc(var(--gy) - 130px);
    background:radial-gradient(circle, rgba(167,121,255,.28), rgba(124,77,219,.08) 45%, transparent 70%); }

  /* ---------- header ---------- */
  header { position:relative; z-index:1; display:flex; align-items:center; gap:10px; padding:12px 12px 11px 16px;
    border-bottom:1px solid rgba(167,139,250,.18); flex:none; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:15.5px; color:#efe7ff; white-space:nowrap; }
  .brand svg { width:20px; height:20px; flex:none; filter:drop-shadow(0 0 6px rgba(196,181,253,.55)); }
  .ctx { flex:1; min-width:0; display:flex; align-items:center; gap:7px; margin:0 2px; padding:4px 5px 4px 10px; border-radius:999px;
    background:rgba(9,6,15,.55); border:1px solid rgba(255,255,255,.09); box-shadow:inset 0 1px 0 rgba(255,255,255,.04); }
  .wave { display:flex; align-items:center; gap:2px; height:18px; flex:none; }
  .wave i { width:2px; border-radius:2px; background:linear-gradient(#e2d6ff, #9f7bff); height:var(--h); opacity:.55; transform-origin:center; }
  .wave.active i { opacity:1; animation:bar .9s ease-in-out infinite; animation-delay:var(--d); }
  @keyframes bar { 0%,100% { transform:scaleY(.35); } 50% { transform:scaleY(1); } }
  .file { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#e2d9f7;
    padding:3px 10px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.06); }
  .file.none { color:var(--muted); font-style:italic; }
  .round { all:unset; cursor:pointer; width:30px; height:30px; flex:none; display:grid; place-items:center; border-radius:50%;
    border:1px solid rgba(255,255,255,.12); background:rgba(255,255,255,.03); color:#cdbff0; transition:.15s; }
  .round:hover { background:rgba(167,139,250,.18); border-color:rgba(196,181,253,.5); color:#fff; }
  .round svg { width:14px; height:14px; }

  /* ---------- conversation ---------- */
  #log { position:relative; z-index:1; padding:14px 16px 6px; max-height:330px; overflow-y:auto; font-size:14px; line-height:1.55; color:var(--soft); }
  .msg { margin:0 0 12px; }
  .msg.user { display:flex; justify-content:flex-end; }
  .msg.user .b { background:linear-gradient(135deg, rgba(139,92,246,.55), rgba(91,48,180,.6)); border:1px solid rgba(196,181,253,.25);
    color:#fff; border-radius:16px 16px 4px 16px; padding:7px 12px; max-width:85%; white-space:pre-wrap; }
  .msg.bot .b p { margin:0 0 7px; }
  .msg.bot ul { margin:4px 0 7px; padding-left:18px; } .msg.bot li { margin:3px 0; }
  .msg.bot li::marker { color:var(--violet); }
  .tag { font-size:11px; letter-spacing:.3px; color:var(--accent); opacity:.8; margin-bottom:3px; }
  code { font-family:"Cascadia Code",Consolas,monospace; font-size:12.3px; background:rgba(139,92,246,.18); padding:1px 5px; border-radius:5px; word-break:break-all; color:#e6dcff; }
  a.file { cursor:pointer; text-decoration:none; border-bottom:1px dashed #9b7cf0; }
  a.file:hover code { background:rgba(139,92,246,.42); }
  strong { color:#fff; }
  .why { margin-top:7px; padding:7px 10px; border-left:2px solid var(--accent); border-radius:0 8px 8px 0; background:rgba(139,92,246,.1); color:#ddd3f7; }
  .error { color:var(--err); } .hint { color:var(--soft); }
  .grade { display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:999px; margin-top:4px; }
  .grade.correcto { background:#1f5a3a; color:#b6f5cf; } .grade.parcial { background:#5a4a1f; color:#f5e3b6; } .grade.incorrecto { background:#5a1f2f; color:#f5b6c6; }
  .loading { color:var(--muted); } .loading::after { content:''; animation:dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }

  /* spotlight chips: dark glass, glowing left accent, light that follows the cursor */
  .chips { display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-top:10px; }
  .chip { all:unset; cursor:pointer; position:relative; max-width:100%; box-sizing:border-box; font-size:13.5px; line-height:1.4; color:#e9e2fb;
    padding:8px 16px 8px 15px; border-radius:999px; border:1px solid rgba(255,255,255,.08);
    background: radial-gradient(140px circle at var(--mx, -200px) var(--my, 50%), rgba(167,139,250,.22), transparent 70%), rgba(14,10,24,.72);
    box-shadow: inset 2px 0 0 #a585ff, -3px 0 10px -4px rgba(167,139,250,.9); transition:border-color .15s, transform .15s; }
  .chip:hover { border-color:rgba(196,181,253,.35); transform:translateX(2px); }

  /* ---------- input bar ---------- */
  footer { position:relative; z-index:1; display:flex; gap:10px; align-items:center; padding:10px 14px 14px; flex:none; }
  .field { flex:1; min-width:0; display:flex; align-items:flex-end; gap:6px; padding:5px 5px 5px 16px; border-radius:24px;
    background:rgba(7,5,12,.6); border:1px solid rgba(255,255,255,.1); box-shadow:inset 0 1px 0 rgba(255,255,255,.04); transition:border-color .15s; }
  .field:focus-within { border-color:rgba(167,139,250,.55); }
  textarea { flex:1; resize:none; background:transparent; color:var(--text); border:0; outline:none; padding:7px 0;
    font:14px "Segoe UI Variable Text","Segoe UI",sans-serif; line-height:20px; max-height:90px; min-height:20px; overflow-y:hidden; }
  textarea::placeholder { color:#8e83ab; }
  textarea.listening { color:#ffd3f1; font-style:italic; }
  #mic { all:unset; cursor:pointer; width:34px; height:34px; flex:none; display:grid; place-items:center; border-radius:50%;
    background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1); color:#d8cbff; transition:.15s; }
  #mic:hover { background:rgba(167,139,250,.2); color:#fff; }
  #mic svg { width:16px; height:16px; }
  #mic.on { background:rgba(255,127,214,.18); border-color:#ff9be0; color:#ffd3f1; animation:pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow:0 0 0 5px rgba(255,127,214,.22); } }
  #send { all:unset; cursor:pointer; flex:none; font-weight:600; font-size:14px; color:#fff; padding:10px 18px; border-radius:999px;
    background:linear-gradient(135deg, #b48cff 0%, #8b5cf6 55%, #6d3fd8 100%);
    box-shadow:0 0 18px rgba(139,92,246,.55), inset 0 1px 0 rgba(255,255,255,.35); transition:.15s; }
  #send:hover { filter:brightness(1.1); box-shadow:0 0 24px rgba(139,92,246,.75), inset 0 1px 0 rgba(255,255,255,.35); }
  #send:disabled { opacity:.5; cursor:default; filter:none; }

  /* ---------- energy arc from the panel to Obsi-boty ---------- */
  .arc { position:fixed; right:0; bottom:0; width:64px; height:170px; pointer-events:none; overflow:visible; }
  body.side-right .arc { right:auto; left:0; transform:scaleX(-1); }
  .arc path { fill:none; stroke-linecap:round; }
  .arc .glow { stroke:rgba(167,121,255,.55); stroke-width:7; filter:blur(4px); }
  .arc .core { stroke:url(#arcGrad); stroke-width:2; }
  .arc .flow { stroke:#efe6ff; stroke-width:1.6; stroke-dasharray:6 120; animation:flow 2.6s linear infinite; opacity:.9; }
  @keyframes flow { to { stroke-dashoffset:-126; } }

  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-thumb { background:#3a2c55; border-radius:4px; }
</style>
</head>
<body class="side-left">
<svg class="arc" viewBox="0 0 64 170" aria-hidden="true">
  <defs><linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c4ddb" stop-opacity=".2"/><stop offset=".5" stop-color="#b79aff"/><stop offset="1" stop-color="#e4d6ff"/></linearGradient></defs>
  <path class="glow" d="M 4 18 C 40 30, 62 80, 60 166"/>
  <path class="core" d="M 4 18 C 40 30, 62 80, 60 166"/>
  <path class="flow" d="M 4 18 C 40 30, 62 80, 60 166"/>
</svg>
<div class="card" id="card">
  <header>
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="7" width="16" height="13" rx="5" fill="#c4b5fd"/><rect x="11.2" y="2.5" width="1.6" height="4.5" rx=".8" fill="#c4b5fd"/><circle cx="12" cy="2.6" r="1.6" fill="#e9e0ff"/><rect x="2" y="11.5" width="2" height="4" rx="1" fill="#a78bfa"/><rect x="20" y="11.5" width="2" height="4" rx="1" fill="#a78bfa"/><rect x="8.3" y="11" width="2.4" height="4.2" rx="1.2" fill="#1c1430"/><rect x="13.3" y="11" width="2.4" height="4.2" rx="1.2" fill="#1c1430"/></svg>
      <span id="title">Obsi-boty</span>
    </div>
    <div class="ctx" title="Archivo que Obsi-boty está viendo en VS Code">
      <div class="wave" id="wave"></div>
      <span class="file none" id="ctxFile">sin archivo</span>
    </div>
    <button class="round" id="reset" title="Nueva conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
    <button class="round" id="close" title="Cerrar (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </header>
  <div id="log"></div>
  <footer>
    <div class="field">
      <textarea id="input" rows="1" placeholder="Pregúntale algo…"></textarea>
      <button id="mic" title="Hablarle (Ctrl+Alt+Espacio)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 10v4M8 7v10M12 4v16M16 7v10M20 10v4"/></svg></button>
    </div>
    <button id="send">Enviar</button>
  </footer>
</div>
<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('input');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const SUGGESTIONS = ['¿Qué archivos debo saber defender?', 'Hazme una pregunta de examen', 'Hazme un reto "muéstrame": pídeme que te muestre un archivo del proyecto.', 'Muéstrame dónde se hace el login'];

function inline(s, files) {
  return esc(s)
    .replace(/`([^`]+)`/g, (_, code) => {
      const raw = code.replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
      const f = files && files[raw];
      return f ? `<a class="file" data-file="${esc(f.file)}" data-line="${f.line || ''}" title="Abrir en VS Code"><code>${code}</code></a>` : `<code>${code}</code>`;
    })
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
}

// tiny markdown: paragraphs, "- " bullets, `code` (clickable when it's a real file), **bold**, "Por qué:" highlight
function render(text, files) {
  const out = []; let list = null;
  for (const raw of text.split(/\r?\n/)) {
    const line = raw.trim();
    if (!line) { list = null; continue; }
    const m = line.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (m) { if (!list) { list = []; out.push(list); } list.push(m[1]); continue; }
    list = null;
    out.push(/^\**por qu[eé]\**:/i.test(line) ? { why: line } : line);
  }
  return out.map(b => Array.isArray(b) ? `<ul>${b.map(i => `<li>${inline(i, files)}</li>`).join('')}</ul>`
    : b.why ? `<div class="why">${inline(b.why, files)}</div>` : `<p>${inline(b, files)}</p>`).join('');
}

function addMessage(m) {
  hideLoading();
  const div = document.createElement('div');
  div.className = `msg ${m.role}`;
  if (m.role === 'user') div.innerHTML = `<div class="b">${esc(m.text)}</div>`;
  else {
    let html = m.tag ? `<div class="tag">${esc(m.tag)}</div>` : '';
    if (m.kind === 'error') html += `<p class="error">${esc(m.text)}</p>`;
    else if (m.kind === 'hint') html += `<p class="hint">${esc(m.text)}</p>`;
    else html += render(m.text, m.files);
    if (m.grade) html += `<span class="grade ${m.grade}">${{ correcto:'✔ Correcto', parcial:'≈ Casi', incorrecto:'✘ Incorrecto' }[m.grade]}</span>`;
    const chips = [];
    if (m.open) chips.push(`<button class="chip" data-file="${esc(m.open.file)}" data-line="${m.open.line || ''}">📂 Abrir ${esc(m.open.file.split(/[\\/]/).pop())}</button>`);
    (m.actions || []).forEach(a => chips.push(`<button class="chip" data-action="${esc(a.value)}">${esc(a.label)}</button>`));
    if (chips.length) html += `<div class="chips">${chips.join('')}</div>`;
    div.innerHTML = `<div class="b">${html}</div>`;
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  reportHeight();
}

let loadingEl = null;
function showLoading(text) {
  hideLoading();
  loadingEl = document.createElement('div');
  loadingEl.className = 'msg bot'; loadingEl.innerHTML = `<p class="loading">${esc(text)}</p>`;
  log.appendChild(loadingEl); log.scrollTop = log.scrollHeight; $('send').disabled = true; reportHeight();
}
function hideLoading() { if (loadingEl) { loadingEl.remove(); loadingEl = null; } $('send').disabled = false; }

function showSuggestions() {
  addMessage({ role:'bot', kind:'hint', text:'¡Hola! Pregúntame lo que quieras del proyecto, o elige una:',
    actions: [{ label:'🎙 Simulacro de defensa oral', value:'sim-start' }, ...SUGGESTIONS.map(s => ({ label:s, value:'say:' + s }))] });
}

function send() {
  const text = input.value.trim();
  if (!text || $('send').disabled) return;
  speechSynthesis.cancel(); bubble.speaking(false);         // you talk → Obsi-boty stops talking
  input.value = ''; autosize();
  bubble.send(text);
}
function autosize() { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 90) + 'px'; input.style.overflowY = input.scrollHeight > 90 ? 'auto' : 'hidden'; reportHeight(); }
function reportHeight() { requestAnimationFrame(() => bubble.setHeight($('card').offsetHeight + 18)); }

log.addEventListener('click', e => {
  const el = e.target.closest('[data-file],[data-action]');
  if (!el) return;
  if (el.dataset.file) bubble.openFile(el.dataset.file, el.dataset.line ? Number(el.dataset.line) : null);
  else if (el.dataset.action.startsWith('say:')) bubble.send(el.dataset.action.slice(4));
  else bubble.action(el.dataset.action);
});
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', autosize);
addEventListener('keydown', e => { if (e.key === 'Escape') bubble.close(); });
$('send').onclick = send;
$('mic').onclick = () => { speechSynthesis.cancel(); bubble.listenNow(); };
// while the ear is listening, show live what it understands
bubble.onListening(on => {
  $('mic').classList.toggle('on', on); input.classList.toggle('listening', on);
  input.placeholder = on ? 'Te escucho…' : 'Pregúntale algo…';
  if (!on && input.classList.contains('listening') === false) { input.value = ''; autosize(); }
});
bubble.onPartial(t => { input.value = t; autosize(); });
$('close').onclick = () => bubble.close();
$('reset').onclick = () => bubble.reset();

bubble.onOpen(p => { if (p.title) $('title').textContent = p.title; if (!log.children.length) showSuggestions(); if (p.focus) input.focus(); reportHeight(); });
bubble.onMessage(addMessage);
bubble.onLoading(t => t ? showLoading(t) : hideLoading());
bubble.onReset(() => { log.innerHTML = ''; $('title').textContent = 'Obsi-boty'; showSuggestions(); });
new ResizeObserver(reportHeight).observe($('card'));

// ---------- look & feel ----------
// voice wave in the context pill: idle = soft static bars; animated while Obsi-boty speaks or listens
const wave = $('wave');
[5, 9, 14, 7, 16, 10, 13, 6, 11, 7, 4].forEach((h, i) => {
  const bar = document.createElement('i');
  bar.style.setProperty('--h', h + 'px'); bar.style.setProperty('--d', (i * 0.07 % 0.9).toFixed(2) + 's');
  wave.appendChild(bar);
});
let isSpeaking = false, isListening = false;
const syncWave = () => wave.classList.toggle('active', isSpeaking || isListening);
bubble.onListening(on => { isListening = on; syncWave(); });

// spotlight that follows the cursor over the suggestion chips
log.addEventListener('mousemove', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
});
log.addEventListener('mouseout', e => { const c = e.target.closest('.chip'); if (c) c.style.setProperty('--mx', '-200px'); });

// which file Obsi-boty is looking at in VS Code
bubble.onContext(name => { const f = $('ctxFile'); f.textContent = name || 'sin archivo'; f.classList.toggle('none', !name); f.title = name || ''; });
// which side Obsi-boty is on: the arc and the brightest border point at him
bubble.onSide(side => { document.body.classList.toggle('side-right', side === 'right'); document.body.classList.toggle('side-left', side !== 'right'); reportHeight(); });

// ---------- voice out: Windows voices (offline) through the Web Speech API ----------
// Text is cleaned for the ear: paths become file names, markdown symbols and emoji are dropped.
function forSpeech(text) {
  return String(text)
    .replace(/`([^`]+)`/g, (_, c) => /[\\/]/.test(c) || /\.\w{1,5}$/.test(c) ? c.split(/[\\/]/).pop().replace(/\.(php|ts|js|md|json|html|scss|blade)$/i, '') : c)
    .replace(/\*\*|__|[#>*`]/g, '')
    .replace(/^\s*[-•]\s+/gm, '. ')
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')
    .replace(/→/g, ', luego, ')
    .replace(/\s+/g, ' ').trim();
}
function pickVoice(name) {
  const voices = speechSynthesis.getVoices();
  return voices.find(v => v.name.includes(name) && v.lang.startsWith('es'))
      || voices.find(v => v.lang === 'es-MX') || voices.find(v => v.lang.startsWith('es')) || null;
}
let speakTimer = null, speakGen = 0;
function speak({ text, voice }) {
  speechSynthesis.cancel();
  const gen = ++speakGen;                                  // an interrupted answer must not turn the "talking" glow off
  const clean = forSpeech(text);
  if (!clean) return;
  // long answers are split into sentences so a long one never gets cut off by the engine
  const parts = clean.match(/[^.!?¿¡]+[.!?]*|[¿¡][^?!]+[?!]/g) || [clean];
  const v = pickVoice(voice || 'Raul');
  parts.forEach((p, i) => {
    const u = new SpeechSynthesisUtterance(p.trim());
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'es-MX';
    u.rate = 1.05; u.pitch = 1.0;
    if (i === 0) u.onstart = () => { bubble.speaking(true); isSpeaking = true; syncWave(); };
    if (i === parts.length - 1) u.onend = u.onerror = () => { if (gen === speakGen) { bubble.speaking(false); isSpeaking = false; syncWave(); } };
    speechSynthesis.speak(u);
  });
}
speechSynthesis.onvoiceschanged = () => {};                  // makes Chromium load the voice list early
bubble.onSpeak(p => { clearTimeout(speakTimer); speakTimer = setTimeout(() => speak(p), 120); });
bubble.onStopSpeaking(() => { clearTimeout(speakTimer); speakGen++; speechSynthesis.cancel(); bubble.speaking(false); isSpeaking = false; syncWave(); });
</script>
</body>
</html>
